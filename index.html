처음 보는 번호도, 발신자 이름도 없었다. 광고 문자인가 싶어 화면을 밀어 보았지만 삭제 버튼이 나타나지 않았다.

function endingType(){let special=state.k.length>=5&&state.k.some(n=>n>=5&&n<=7)&&state.k.some(n=>n>=9&&n<=12);if(special)return"D";if(state.t>=12&&state.e>=12)return"C";if(state.e>state.t)return"B";return"A"}
function choose(i){if(state.selected!==null)return;state.selected=i;let o=STAGES[state.stage].opts[i];state.choices.push(i);state.t+=o[1];state.e+=o[2];state.r+=o[3];if(o[4])state.k.push(state.stage+1);render()}

function render(){cancelEffects();document.body.classList.toggle("unsettled",state.stage>=4);document.body.classList.toggle("late",state.stage>=8);if(state.stage===-1)return intro();if(state.phase==="ending")return renderEnding();let i=state.stage,s=STAGES[i];let title=`<div class="eyebrow">동거인 확인 절차 · ${String(i+1).padStart(2,"0")} / 12</div><h1 class="heading">제${i+1}항 — ${RULES[i][0]}</h1><div class="rule"><strong>제${i+1}항.</strong><p>${escapeHtml(currentRule(i))}</p></div><div class="time">${s.time}</div>`;let body=prose(s.intro);
if(state.selected===null){let opts=s.opts.map((o,j)=>`<button class="choice" data-choice="${j}">${j+1}. ${escapeHtml(o[0])}</button>`).join("");app.innerHTML=title+body+`<div class="choices">${opts}</div>`;document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));
 if(i===9){afterDelay(()=>{const box=document.querySelector('.choices');if(!box||state.selected!==null)return;const g=document.createElement('div');g.className='choice ghost-choice';g.textContent='4. 정요가 죽었다는 사실을 인정한다';box.appendChild(g);afterDelay(()=>g.remove(),820)},1100)}
 if(i===4){afterDelay(()=>{const scene=document.querySelector('.vn-page.active');if(!scene||state.selected!==null)return;const g=document.createElement('p');g.className='narration uncanny-phrase';g.textContent='"나 안 잤어."';scene.appendChild(g);afterDelay(()=>{if(g.isConnected)g.textContent='"나 안 죽었어."'},1500);afterDelay(()=>g.remove(),3900)},1200)}
 return}
body+=prose(s.opts[state.selected][5]);
if(i===9)body+=`<div class="system"><small>동거인 확인 시스템</small><strong>제10항 확인 완료</strong><div>확인 대상: 최정요<br>이전 확인 횟수: 17회</div><div class="muted">이전 확인 결과를 불러오지 못했습니다.</div></div>`+prose(`17회.

나는 이걸 처음 하는데.

정요가 화면을 바라보았다.

"그걸 나한테 물어보면 어떡해."`);
if(i===10)body+=prose(`정요가 빈 컵을 싱크대에 놓았다.

"비오야. 오늘 나 때문에 많이 피곤했지."

"아니야."

"거짓말."

정요가 내 옷깃을 정리해 주었다.

"이제 그만해도 돼."

"뭘?"

정요는 대답하지 않았다.

"우리 조금만 더 같이 있자."`);
if(i===11)body+=`<div class="system"><small>동거인 확인 시스템</small><strong>최종 확인 완료</strong><div><span class="strike">확인 대상: 최정요</span><br>변경된 확인 대상: 강비오<br>이전 확인 횟수: 17회</div><div class="muted">최종 판정: 불가</div></div>`+prose(`정요를 바라보았다.

정요는 아무 말도 하지 않았다.

다만 내 손을 잡고 있었다.`);
else body+=`<div class="system"><small>동거인 확인 시스템</small><strong>제${i+1}항 확인 완료</strong><div class="muted">다음 항목: ${RULES[i+1][0]}</div></div>`;
app.innerHTML=title+body+`<button class="next" id="next">${i===11?"최종 결과 확인":"다음 항목으로 →"}</button>`;
 if(i===9){const box=app.querySelector('.system');if(box){const ghost=document.createElement('div');ghost.className='ghost-line';ghost.textContent='이번에는 어디까지 기억하십니까?';box.appendChild(ghost);afterDelay(()=>ghost.classList.add('gone'),2200);afterDelay(()=>ghost.remove(),3600)}}
 document.getElementById("next").onclick=next}
function renderEnding(){let e=ENDINGS[state.ending];app.innerHTML=`<div class="eyebrow">동거인 확인 절차 · 종료</div><div class="time">${e.time}</div>${prose(e.body)}<div class="ending-finale" role="status"><div class="ending-overline">확인 절차 종료</div><div class="ending-index">ENDING ${state.ending} / 4</div><div class="end-title">${e.name}</div><div class="ending-divider"></div><div class="ending-status">${e.state}</div><div class="ending-complete">모든 확인 절차가 종료되었습니다.</div><button class="ending-restart" id="replay">처음부터 다시 시작 ↺</button><div class="ending-lastline">당신이 확인한 것은 무엇이었습니까?</div></div>`;document.getElementById("replay").onclick=()=>{reset(true);titleOpened=false;document.getElementById("titleScreen").hidden=false}}

// Two restrained anomalies, only once on the relevant scene.
function scheduleExtraHorror(){
 if(state.stage===2 && state.selected===null){
   afterDelay(()=>{
     const clock=document.querySelector('.vn-page.active .time');
     if(!clock||state.stage!==2||state.selected!==null)return;

   },2400);

 if(state.stage===6 && state.selected===null){
   afterDelay(()=>{
     const active=document.querySelector('.vn-page.active');
     if(!active||state.stage!==6||state.selected!==null)return;

// Page-by-page visual novel reader. Keeps original choices, scoring, and horror effects.
let vnIndex=0, vnPages=[];
let titleOpened=false;
function startFromTitle(){titleOpened=true;document.getElementById('titleScreen').hidden=true;vnShow()}
document.getElementById('titleScreen').addEventListener('click',startFromTitle);
document.getElementById('titleScreen').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();startFromTitle()}});
function vnGroup(root){
 const nodes=Array.from(root.children), chunks=[];
 let current=[], weight=0;
 const flush=()=>{if(current.length){chunks.push(current);current=[];weight=0}};
 const add=(node,w)=>{if(weight+w>38&&current.length)flush();current.push(node);weight+=w};
 for(const node of nodes){
  if(node.classList.contains('scene')){
   const items=Array.from(node.children);node.remove();
   for(const item of items){
    const len=(item.textContent||'').length;
    const w=(item.classList.contains('dialogue')?1.35:1.1)+Math.max(0,len-35)/48;
    add(item,Math.min(3.3,w));
   }
  }else if(node.classList.contains('choices')){
   // A choice is a scene decision, keep on its own page only when necessary.
   if(weight>20)flush();
   current.push(node);weight+=5.3;flush();
  }else if(node.classList.contains('next')){
   current.push(node);flush();
  }else if(node.classList.contains('footnote')){
   current.push(node);flush();
  }else if(node.classList.contains('ending-finale')){
   flush();chunks.push([node]);
  }else if(node.classList.contains('system')){
   if(weight>20)flush();add(node,4);
  }else if(node.classList.contains('rule')){
   if(weight>20)flush();add(node,4.5);
  }else add(node,node.classList.contains('heading')?1.6:.5);
 }
 flush();return chunks;
}
function paginate(){
 const root=document.getElementById('app');
 if(!root || root.querySelector('.vn-page'))return;
 const selected=state.selected!==null && state.phase!=='ending' && state.stage>=0;
 // After choosing, skip replaying the scene the player already read.
 if(selected){
   const scenes=root.querySelectorAll('.scene');
   if(scenes.length>1)scenes[0].remove();
 }
 const chunks=vnGroup(root);
 vnPages=chunks.map((items,i)=>{
   const page=document.createElement('section');page.className='vn-page';page.setAttribute('aria-label','이야기 '+(i+1));
   items.forEach(n=>page.appendChild(n));root.appendChild(page);return page;
 });
 if(!document.getElementById('vnFooter')){
   const footer=document.createElement('div');footer.id='vnFooter';footer.className='vn-footer';
   footer.innerHTML='<div class="vn-footer-inner"><span class="vn-progress" id="vnProgress"></span><div class="vn-footer-actions"><button class="vn-back" id="vnBack">◂ 이전</button><button class="vn-advance" id="vnAdvance">다음 ▸</button></div></div>';
   document.body.appendChild(footer);
   document.getElementById('vnAdvance').onclick=vnNext;
   document.getElementById('vnBack').onclick=vnBack;
   root.addEventListener('click',e=>{
     if(e.target.closest('button,a,.choices,.next,.system,.rule'))return;
     if(vnPages[vnIndex]?.contains(e.target))vnNext();
   });

 }
 // Split pages based on their actual available height, rather than arbitrary line counts.
 // Each page is measured in the rendered layout, so none requires vertical scrolling.
 const heightLimit=Math.max(100,Math.floor(root.clientHeight*0.83));
 const measured=[];
 for(const page of vnPages){
   page.classList.add('active');
   const elements=Array.from(page.children);
   let piece=document.createElement('section');piece.className='vn-page active';root.appendChild(piece);
   for(const element of elements){
     piece.appendChild(element);
     if(piece.scrollHeight>heightLimit && piece.children.length>1){
       piece.removeChild(element);measured.push(piece);
       piece=document.createElement('section');piece.className='vn-page active';root.appendChild(piece);piece.appendChild(element);
     }
   }
   if(piece.children.length)measured.push(piece);else piece.remove();
   page.remove();
 }
 vnPages=measured;
 // Never hide text: even if a single long paragraph exceeds the screen,
 // it remains accessible instead of being cropped.
 vnPages.forEach(p=>{
   if(p.scrollHeight>p.clientHeight+2)p.classList.add('vn-overflow-fallback');
 });
 extraPlayed={};vnIndex=0;vnShow();scheduleExtraHorror();
}
let extraPlayed={};
function triggerNewAnomalies(){
 const page=vnPages[vnIndex];
 if(!page||state.selected!==null||state.phase==='ending')return;
 // Stage 4: the phone briefly detects a second person in the photograph.
 if(state.stage===3 && !extraPlayed.photo && page.querySelector('.narration')){
  extraPlayed.photo=true;
  afterDelay(()=>{
   if(!page.isConnected||!page.classList.contains('active')||state.stage!==3)return;

   note.innerHTML='<span>사진 분석</span><b>인물 2명 감지</b>';
   page.appendChild(note);
   afterDelay(()=>{if(note.isConnected)note.querySelector('b').textContent='인물 1명 감지'},1050);
   afterDelay(()=>note.remove(),2450);
  },1900);
 }
 // Stage 9: a purchase-history overlay contains an impossible recipient.
 if(state.stage===8 && !extraPlayed.recipient && page.querySelector('.narration')){
  extraPlayed.recipient=true;
  afterDelay(()=>{
   if(!page.isConnected||!page.classList.contains('active')||state.stage!==8)return;
   const note=document.createElement('div');note.className='subtle-anomaly recipient-anomaly';
   note.innerHTML='<span>배송 완료</span><b>수령인: 최정요</b>';
   page.appendChild(note);
   afterDelay(()=>{if(note.isConnected)note.querySelector('b').textContent='수령인: —'},1200);
   afterDelay(()=>note.remove(),2600);
  },2100);
 }
}
function vnShow(){
 vnPages.forEach((p,i)=>p.classList.toggle('active',i===vnIndex));

 const page=vnPages[vnIndex];
 if(!page)return;
 page.scrollTop=0;
 const nextStage=page.querySelector('#next');
 const choices=!!page.querySelector('.choice,#start,#replay');
 button.hidden=choices || (!nextStage && vnIndex>=vnPages.length-1);
 button.textContent=nextStage ? (state.stage===11?'최종 결과 확인 ▸':'다음 항목으로 ▸') : '다음 ▸';

}
function vnBack(){if(modal.classList.contains('open'))return;if(vnIndex>0){vnIndex--;vnShow()}}
function vnNext(){

}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&!modal.classList.contains('open')&&e.target.tagName!=='BUTTON'){e.preventDefault();vnBack()}if((e.key===' '||e.key==='Enter'||e.key==='ArrowRight')&&!modal.classList.contains('open')&&e.target.tagName!=='BUTTON'){e.preventDefault();vnNext()}});
const renderOriginal=render;
render=function(){renderOriginal();paginate()};
const renderEndingOriginal=renderEnding;
